<style id="ns-theme">
:root{--color-ink:#04060a;--color-panel:#0b1218;--color-edge:rgb(60 242 208 / .16)}
html,body{background:#04060a!important}
body{font-family:"Inter",system-ui,sans-serif}
#root{position:relative;z-index:1}
/* ---- fondo ---- */
#nsbg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:
 radial-gradient(ellipse at 50% 120%,rgb(60 242 208/.14),transparent 60%),#04060a}
#nsbg .o{position:absolute;border-radius:50%;animation:nsfloat 18s ease-in-out infinite alternate}
#nsbg .o1{width:90vmax;height:90vmax;left:-40vmax;top:-45vmax;background:radial-gradient(circle,rgb(60 242 208/.28),transparent 62%)}
#nsbg .o2{width:80vmax;height:80vmax;right:-40vmax;top:15vh;background:radial-gradient(circle,rgb(139 92 246/.30),transparent 62%);animation-delay:-6s}
#nsbg .o3{width:70vmax;height:70vmax;left:-20vmax;bottom:-40vmax;background:radial-gradient(circle,rgb(255 61 139/.20),transparent 62%);animation-delay:-11s}
#nsbg .floor{position:absolute;left:-60%;right:-60%;bottom:-8vh;height:52vh;opacity:.32;
 background-image:linear-gradient(rgb(60 242 208/.5) 1px,transparent 1px),linear-gradient(90deg,rgb(60 242 208/.5) 1px,transparent 1px);
 background-size:46px 46px;transform:perspective(380px) rotateX(64deg);transform-origin:50% 100%;
 -webkit-mask-image:linear-gradient(to top,#000 8%,transparent 78%);mask-image:linear-gradient(to top,#000 8%,transparent 78%);animation:nsgrid 5s linear infinite}
#nsrain{position:absolute;inset:0;width:100%;height:100%;opacity:.22;
 -webkit-mask-image:linear-gradient(#000 0,#000 55%,transparent 100%);mask-image:linear-gradient(#000 0,#000 55%,transparent 100%)}
#nsbg .scan{position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 2px,rgb(0 0 0/.22) 2px 3px);opacity:.35}
#nsbg .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgb(0 0 0/.65))}
@keyframes nsfloat{to{transform:translate3d(8vmax,6vmax,0) scale(1.12)}}
@keyframes nsgrid{to{background-position:0 46px}}
@keyframes nsblink{50%{opacity:0}}
/* ---- cristal ---- */
[class*="bg-ink"]{background-color:rgb(4 7 11/.38)!important}
[class*="bg-panel"]{background-color:rgb(9 15 22/.56)!important;
 box-shadow:inset 0 1px 0 rgb(255 255 255/.05),0 6px 24px rgb(0 0 0/.35);transition:border-color .2s,box-shadow .2s,transform .15s}
[class*="bg-panel"]:hover{border-color:rgb(60 242 208/.45)!important;box-shadow:inset 0 1px 0 rgb(255 255 255/.06),0 0 22px rgb(60 242 208/.14),0 6px 24px rgb(0 0 0/.4)}
header,aside,[role="dialog"],[class*="rounded-2xl"][class*="bg-panel"],[class*="rounded-3xl"][class*="bg-panel"]{-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
aside{background-color:rgb(5 9 14/.78)!important;border-right:1px solid rgb(60 242 208/.2)!important}
header{border-bottom:1px solid rgb(60 242 208/.18)!important}
/* ---- estilo hacker ---- */
h1,h2,h3{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:-.02em}
h1::after{content:"▍";margin-left:2px;color:#3cf2d0;font-weight:400;animation:nsblink 1s steps(1) infinite}
.text-neon{text-shadow:0 0 14px rgb(60 242 208/.55)}
button[class*="bg-neon"]{box-shadow:0 0 20px rgb(60 242 208/.45),inset 0 1px 0 rgb(255 255 255/.35)}
input:not([type=checkbox]):not([type=radio]),textarea{background-color:rgb(0 0 0/.5)!important;font-family:"JetBrains Mono",ui-monospace,monospace}
input:focus,textarea:focus{outline:none;box-shadow:0 0 0 1px #3cf2d0,0 0 18px rgb(60 242 208/.28)!important}
video{box-shadow:0 0 0 1px rgb(60 242 208/.25),0 0 40px rgb(60 242 208/.12)}
::selection{background:rgb(60 242 208/.35)}
*{scrollbar-width:thin;scrollbar-color:rgb(60 242 208/.4) transparent}
@media (prefers-reduced-motion:reduce){#nsbg *{animation:none!important}#nsrain{display:none}}
</style>
